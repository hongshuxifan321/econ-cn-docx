# 通用版式（base）— 《经济研究》投稿体例（A 版：投稿用，非刊登版）
#
# 这就是默认出稿的版式：p.render("论文.docx") 与 p.render("论文.docx", spec="erj") 等价。
# 其他期刊 / 学校另写一个 yaml（首行 extends: base），只列与这里的差异。
#
# 出处（逐项见文件末尾 sources）：
#   官方样张   = 编辑部《稿件体例要求》带红字标注的样张
#   刊登版实测 = 公开刊登论文的字体 / 字号实测
#   推断       = 样张没写、据版面反推，改之前先确认
#
# 注意：刊登版和这份不一样 —— 刊登正文 11.8pt、标题 21.6pt、一级标题 12.7pt，
# 那是编辑部印刷排版的尺寸；投稿用这份。
#
# 改哪个字段 = 改哪一处排版。字段名左半截就是读者看到的元素：
#   title/author/abstract/keyword/heading1-3/body/table/figure/ref/page_number
#
# 行距两种写法：数字 = 倍数（1.5 = 1.5 倍行距）；字符串 "16pt" = 固定值 16 磅。

# ── 页面（A4，单位 cm）──
margin_top: 2.54
margin_bottom: 2.54
margin_left: 2.54         # 推断
margin_right: 2.54

# ── 标题块 ──
title_size: 15            # 小三
title_font: 宋体
title_bold: true          # 推断
subtitle_size: 14
subtitle_font: 宋体       # 刊登版实测
subtitle_bold: false

author_size: 12           # 小四
author_font: 宋体
author_bold: false

# ── 摘要 / 关键词 ──
abstract_label: 内容摘要
abstract_label_font: 黑体
abstract_label_size: 10.5
abstract_font: 仿宋       # 五号
abstract_size: 10.5
abstract_indent: 21       # 缩进 2 字符

keyword_label: 关键词
keyword_label_font: 黑体
keyword_label_size: 10.5
keyword_font: 仿宋
keyword_size: 10.5

# ── 各级标题 ──
heading1_size: 14         # 四号
heading1_font: 宋体
heading1_bold: false      # 推断
heading1_align: center

heading2_size: 10.5       # 五号，前空 2 格（（一））
heading2_font: 宋体
heading2_bold: false      # 推断
heading2_align: left

heading3_size: 9          # 小五，图题 / 表题
heading3_font: 黑体
heading3_bold: false      # 推断
heading3_align: center

# ── 正文 ──
body_size: 10.5           # 五号
body_font: 宋体
body_space_before: 0
body_space_after: 0
body_line_spacing: "16pt" # 推断：固定值 16 磅
body_indent: 21           # 首行缩进 2 字符

# ── 表格（三线表，线宽单位 1/8 pt）──
table_font_size: 9        # 小五
table_font: 仿宋
table_header_font: 仿宋
table_header_bold: false
table_rule_top: 12        # 推断
table_rule_mid: 8         # 推断
table_rule_bottom: 12     # 推断
table_title_size: 10.5
table_title_font: 仿宋    # 刊登版实测
table_title_bold: false
table_note_size: 7.5      # 六号
table_note_font: 宋体

# ── NOTE: 表注行（表下注释，不是脚注）──
note_size: 7.5
note_font: 宋体
note_italic: false

# ── 参考文献 ──
ref_size: 7.5             # 六号
ref_font: 宋体
ref_line_spacing: 1.0
ref_indent: 21            # 每条前空 2 格

# ── 页码 ──
page_number: true         # 刊登版实测
page_number_size: 9
page_number_font: 宋体

# ── 自动编号 ──
auto_number: true         # h1 → 「一、」，h2 → 「（一）」；已有编号则跳过
equation_number: true     # 公式右端 (1)(2)…（官方样张）

# ── 参考文献标题（不是一级标题样式）──
ref_heading_font: 黑体
ref_heading_size: 10.5
ref_heading_bold: true
ref_heading_align: left

# ── 脚注（页下注，每页重新编号）──
footnote_font: 宋体
footnote_size: 7.5        # 六号
footnote_per_page: true
footnote_num_format: chicago   # *†‡；decimal 1,2,3 / decimalEnclosedCircle ①②③

# ── 逐项出处 ──
sources:
  margin_left: 推断
  title_size: 官方样张
  title_font: 官方样张
  subtitle_font: 刊登版实测
  abstract_label: 官方样张
  abstract_font: 官方样张
  keyword_font: 官方样张
  heading1_size: 官方样张
  heading1_bold: 推断
  heading2_size: 官方样张
  heading3_size: 官方样张
  body_size: 官方样张
  body_line_spacing: 推断
  body_indent: 官方样张
  table_font: 官方样张
  table_title_font: 刊登版实测
  table_note_size: 官方样张
  ref_size: 官方样张
  ref_indent: 官方样张
  page_number: 刊登版实测
  equation_number: 官方样张
