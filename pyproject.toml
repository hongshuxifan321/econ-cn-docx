[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cn-docx"
version = "2.1.0"
description = "经管实证论文中文学术 Word 排版（单文件模块 cnpaper）"
requires-python = ">=3.9"
dependencies = [
    "python-docx>=1.0",
    "lxml>=4.9",
    "PyYAML>=6.0",
]

[tool.setuptools]
py-modules = ["cnpaper"]
